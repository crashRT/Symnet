services:
  symnet:
    build: .
    image: mosaic/symnet:latest
    mem_limit: 12g
    container_name: symnet
    working_dir: /Symnet
    volumes:
      # SymNet source (read-only; already compiled into the image)
      - .:/Symnet
      # Default shared working directory. MosaicRunner normally receives an
      # explicit bind mount at this path so results written under /mosaic_work
      # are visible to the Python process.
      - mosaic_work:/mosaic_work

volumes:
  mosaic_work:
    # Fallback named volume for direct docker compose usage.
    name: mosaic_work
