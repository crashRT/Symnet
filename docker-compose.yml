services:
  symnet:
    build: .
    image: mosaic/symnet:latest
    container_name: symnet
    working_dir: /Symnet
    volumes:
      # SymNet source (read-only; already compiled into the image)
      - .:/Symnet
      # Shared working directory for click configs generated by Mosaic.
      # Mosaic writes .click files here; ClickRunner reads them from /mosaic_work.
      - mosaic_work:/mosaic_work

volumes:
  mosaic_work:
    # Named volume shared between the Mosaic Python process and the SymNet container.
    # Mosaic mounts this volume at runtime when writing/reading click configs.
    name: mosaic_work
